<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420" role="img" aria-label="A 500 ml bottle of Half Sour brine">
  <!--
    Static product plate for components/product/ProductViewer.

    A last-resort image only: the drawn, token-coloured bottle in
    components/product/BottlePlate.tsx is the real static representation and is
    in the server-rendered HTML. This file exists so components/3d/BottleHero
    has a real `fallbackSrc` if the browser withdraws WebGL after the scene has
    already mounted. Colours are baked because an <img> cannot read the page's
    custom properties; they are Ink, Bone, Brine and Rind from
    brand/_src/palette.py.
  -->
  <defs>
    <clipPath id="plateBody">
      <path d="M112 58 L148 58 L148 106 C148 122 188 134 188 168 L188 382 Q188 390 180 390 L80 390 Q72 390 72 382 L72 168 C72 134 112 122 112 106 Z"/>
    </clipPath>
    <radialGradient id="plateKey" cx="32%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#EAE8DB" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#EAE8DB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="260" height="420" fill="#0F1511"/>
  <rect width="260" height="420" fill="url(#plateKey)"/>

  <path d="M112 58 L148 58 L148 106 C148 122 188 134 188 168 L188 382 Q188 390 180 390 L80 390 Q72 390 72 382 L72 168 C72 134 112 122 112 106 Z" fill="#F2EFE3" fill-opacity="0.13"/>

  <g clip-path="url(#plateBody)">
    <rect x="60" y="186" width="140" height="220" fill="#C8D93B" fill-opacity="0.82"/>
    <rect x="60" y="186" width="140" height="5" fill="#F2EFE3" fill-opacity="0.46"/>
    <circle cx="99" cy="228" r="2.6" fill="#0F1511" fill-opacity="0.6"/>
    <circle cx="136" cy="271" r="3.1" fill="#0F1511" fill-opacity="0.6"/>
    <circle cx="110" cy="318" r="2.1" fill="#0F1511" fill-opacity="0.6"/>
    <circle cx="158" cy="352" r="3.6" fill="#0F1511" fill-opacity="0.6"/>
    <rect x="86" y="150" width="7" height="240" fill="#F2EFE3" fill-opacity="0.25"/>
    <rect x="170" y="170" width="4" height="210" fill="#F2EFE3" fill-opacity="0.25"/>
  </g>

  <rect x="108" y="24" width="44" height="30" rx="3" fill="#F2EFE3" fill-opacity="0.58"/>
  <rect x="110" y="54" width="40" height="7" rx="2" fill="#F2EFE3" fill-opacity="0.34"/>

  <rect x="72" y="244" width="116" height="96" fill="#F2EFE3" fill-opacity="0.92"/>
  <text x="130" y="300" text-anchor="middle" fill="#0F1511" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="40" letter-spacing="1">01</text>
  <text x="130" y="322" text-anchor="middle" fill="#0F1511" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="3">HALF SOUR</text>

  <path d="M112 58 L148 58 L148 106 C148 122 188 134 188 168 L188 382 Q188 390 180 390 L80 390 Q72 390 72 382 L72 168 C72 134 112 122 112 106 Z" fill="none" stroke="#D6D2C0" stroke-opacity="0.34" stroke-width="1.5"/>
</svg>
