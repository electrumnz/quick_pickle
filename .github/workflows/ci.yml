name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job reads its Node major from .nvmrc, which matches package.json
# `engines.node` and the Vercel project's Node version.
env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: typecheck / lint / copy / test / build
    # A same-repo pull request is already covered by the push event on its
    # branch, so only run the pull_request event for forks, which push misses.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The legal gate. A banned claim anywhere a customer can read it fails
      # the build; legal/COPY-RULES.md says why. The self-test proves the
      # scanner still catches what it exists to catch.
      - name: Copy rules
        run: |
          npm run audit:copy:selftest
          npm run audit:copy

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: e2e (Playwright) + axe
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # The purchase journey, the page with JavaScript off, and axe over every
      # page at phone and desktop size. Runs against `next start`.
      - name: Run e2e suite
        run: npm run test:e2e -- --trace off

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse budget
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Chrome for Lighthouse
        run: |
          if command -v google-chrome-stable >/dev/null 2>&1; then
            CHROME_BIN="$(command -v google-chrome-stable)"
          elif command -v google-chrome >/dev/null 2>&1; then
            CHROME_BIN="$(command -v google-chrome)"
          else
            npx playwright install --with-deps chromium
            CHROME_BIN="$(node -p "require('@playwright/test').chromium.executablePath()")"
          fi
          echo "Using Chrome at $CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"

      # Lighthouse measures the production build served by `next start`.
      - name: Build
        run: npm run build

      - name: Assert Lighthouse budget
        run: npm run lhci

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true
