name: Infra

# The repository's own hands on its hosting, database and payments. Nobody
# holds dashboard access for the code's sake: this is how the state of Vercel,
# Supabase and Stripe is read, and how the few settings the app needs are
# made. scripts/infra/run.mjs says what each action does.
#
# It runs two ways:
#
#   every push to main   reads the state (the "status" action, which changes
#                        nothing). If that push changed
#                        .github/infra-request.json, it does what the file
#                        asks instead. That is how a change is requested: a
#                        commit, reviewed and merged like any other.
#   by hand              Actions tab, Infra, Run workflow.
#
# It never runs for a pull request or for any branch but main, so unmerged
# code never sees a secret.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        required: true
        default: status
        options:
          - status
          - ensure-setup-code
          - connect-database
      confirm:
        description: Type yes for an action that changes a setting
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  run:
    name: infra
    # Only ever the code on main: a branch cannot borrow the secrets.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # GitHub does not tell a workflow which files a push changed, so it is
      # worked out here: the request file is compared with how it stood before
      # the push.
      - name: Did this push change the request?
        id: request
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          changed=false
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] &&
            git fetch --quiet --depth=1 origin "$BEFORE" 2>/dev/null; then
            if ! git diff --quiet "$BEFORE" HEAD -- .github/infra-request.json; then
              changed=true
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "request changed in this push: $changed"

      - name: Run
        env:
          # Pinned here, not taken from an input: Quick Pickle's own project
          # and team, and nobody else's.
          QP_SUPABASE_PROJECT_REF: kauxjwjrgtlherljlnbp
          QP_VERCEL_TEAM_SLUG: electrumnz-9333s-projects
          QP_VERCEL_TEAM_ID: team_UT2tbR3sJIQqiPCUkYZWLHJO
          # The project's id, not its name: a name can be changed in the
          # dashboard (it already has been once), an id cannot.
          QP_VERCEL_PROJECT: prj_h0tqArvx189vlWVXsp5YtWuitc15
          QP_SUPABASE_ACCESS_TOKEN: ${{ secrets.QP_SUPABASE_ACCESS_TOKEN }}
          QP_VERCEL_TOKEN: ${{ secrets.QP_VERCEL_TOKEN }}
          QP_STRIPE_SECRET_KEY: ${{ secrets.QP_STRIPE_SECRET_KEY }}
          QP_STRIPE_PUBLISHABLE_KEY: ${{ secrets.QP_STRIPE_PUBLISHABLE_KEY }}
          INFRA_EVENT: ${{ github.event_name }}
          INFRA_ACTION: ${{ inputs.action }}
          INFRA_CONFIRM: ${{ inputs.confirm }}
          INFRA_REQUEST_CHANGED: ${{ steps.request.outputs.changed }}
        run: node scripts/infra/run.mjs
